repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/(dbc/.*\.dbc|blast/test\.(pk|txt)|cnv/.*)|src/omnisus/data/dicionarios/sources/cnv/.+/.+)$
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/(dbc/.*\.dbc|blast/test\.(pk|txt)|cnv/.*)|src/omnisus/data/dicionarios/sources/cnv/.+/.+)$
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (src)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false

      - id: gen-datasets-doc
        name: docs/datasets.md is current
        entry: uv run python scripts/gen_datasets_doc.py --check
        language: system
        files: ^(src/omnisus/sources/datasus_ftp/datasets\.py|docs/datasets\.md|scripts/gen_datasets_doc\.py)$
        pass_filenames: false
