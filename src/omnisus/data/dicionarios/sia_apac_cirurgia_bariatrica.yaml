            tem o código ''-zzzz'', que o leitor de CNV guarda como a chave literal ''    -zzzz'', de 9 caracteres,
            e nenhum valor de 4 caracteres casa com ela. O APAC_Pos_Cirurgia_Bariatica.def (linhas 235-240)
            escreve AP_NAT_JUR, nome que nenhum arquivo lido tem. O mapa vem do APAC_Dados_Comuns.DEF (arquivos
            A?*.DBC), que liga AP_NATJUR a NATJURC.CNV nas linhas 204-205; a linha 203 liga o campo a NATJUR.CNV,
            que o leitor de CNV recusa (linha fora do leiaute de colunas), e as linhas 206-208 ligam AP_NAT_JUR
            a ESFERAJUR.CNV e ESFERAJURC.CNV. A máscara sozinha não diz que um arquivo segue esse DEF (issue
            amp-sem-def da AMP): o que sustenta o vínculo é o campo publicado ter o nome que a linha escreve
            e todo valor preenchido lido ser código da tabela.'
