          1 e 2 no documento e S e N nos arquivos, e quem decide são os arquivos, que nos registros contados
          acima gravam S 374.509 vezes, N 951.045 vezes e nenhuma vez 1 ou 2. Segundo a revisora, os dois
          pares dizem se o óbito foi investigado. O mapa fica com as chaves que os arquivos gravam; 1 e
          2 seguem sem rótulo.'
