      issues:
      - id: horaobito-formato-diverge-do-pdf
        status: open
        description: 'O Estrutura_do_SIM_2025.pdf (p. 1) declara HORAOBITO com 5 caracteres, ''Números (padrão
          24 horas 00:00)''. DORR2022 e DORR2023 gravam 4 dígitos, HHMM, sem os dois-pontos (por exemplo
          ''0600''), ou branco. O campo fica sem x-format até um documento descrever o que o arquivo grava.
          Nos arquivos DO de AC, AP, DF, RR, SE e TO de cada ano de 1996 a 2024 e de BA, PA, RS e SP de
          2006, 2015 e 2023 (evidence/2026-11-18-sim-valores-do/), 2.185.721 registros de 2006 a 2024 têm
          4 dígitos e 1.324 têm outra forma: 8 com 5 dígitos, 872 com 4 letras, 344 com 2 ou 3 dígitos e
          100 com outros caracteres, entre eles um ''99.99'' e um ''99;99'' de 2011. Nenhum tem o formato
          00:00.'
