        issues:
        - id: ap_natjur-nem-sempre-publicado
          status: open
          description: 'O censo de 2026-11-19 (evidence/2026-11-19-apac-ap-natjur/files.csv e values.csv)
            leu os 659 arquivos AM de AC, AP e RR que o servidor lista, e nenhum de outra UF. 360 têm AP_NATJUR,
            sempre o último campo, e 299 não têm: nenhum arquivo lido de 2008-01 a 2011-11; 2012-01 a 2014-09;
            2014-11 a 2016-06 tem o campo. Nos arquivos lidos o campo vem preenchido em 802052 registros,
            com 4 códigos distintos, todos no natjurc.cnv, e em branco em 2788. O branco fica sem rótulo:
            a linha ''Não especificado ou ignorado'' da tabela tem o código ''-zzzz'', que o leitor de CNV
            guarda como a chave literal ''    -zzzz'', de 9 caracteres, e nenhum valor de 4 caracteres casa
            com ela. O APAC_Medicamentos.DEF (linhas 212-217) escreve AP_NAT_JUR, nome que nenhum arquivo
            lido tem. O mapa vem do APAC_Dados_Comuns.DEF (arquivos A?*.DBC), que liga AP_NATJUR a NATJURC.CNV
            nas linhas 204-205; a linha 203 liga o campo a NATJUR.CNV, que o leitor de CNV recusa (linha fora
            do leiaute de colunas), e as linhas 206-208 ligam AP_NAT_JUR a ESFERAJUR.CNV e ESFERAJURC.CNV.
            A máscara sozinha não diz que um arquivo segue esse DEF (issue amp-sem-def da AMP): o que sustenta
            o vínculo é o campo publicado ter o nome que a linha escreve e todo valor preenchido lido ser
            código da tabela.'
