# Campos SINAN escritos uma vez; scripts/metadados/gerar_sinan.py os copia para os
# dicionários. Um código só entra em x-decode se uma fonte oficial o lista.
#
# comum: campos da Notificação Individual (DIC_DADOS_Notificacao_Individual_v5.pdf,
#   registro sinan-b3e0561c7a2d). Cada campo vai para todo dicionário SINAN que o tem;
#   o gerador nunca acrescenta nem remove campos (a lista vem do descritor DBF).
# agravo: mapas que só valem para um dicionário (Anexo I e dicionário do agravo).
#
# Em `fontes`, `codigos` lista os códigos que aquela fonte cita. A união de `codigos`
# tem de ser exatamente as chaves de x-decode. Uma fonte com `membro` é um CNV
# empacotado em data/dicionarios/sources/cnv/; o gerador confere que cada código
# está no CNV. O branco ('') só entra onde a página o nomeia ("0 ou branco").
#
# `revisado_em` é o `checked_at` de toda claim `/field/codes` gerada deste bloco:
# mudar a data aqui redata as claims de todos os dicionários SINAN.
revisado_em: '2026-09-22'
